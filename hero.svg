<svg width="100%" height="100%" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- DEFINITIONS AND STYLES -->
    <defs>
        <style>
            /* Global Animations */
            @keyframes fadeIn {
                0% { opacity: 0; }
                100% { opacity: 1; }
            }
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-10px); }
            }
            
            /* Terminal ASCII Reveal */
            @keyframes revealDown {
                from { height: 0; }
                to { height: 600px; }
            }
            .ascii-mask-rect {
                animation: revealDown 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            }
            .ascii-line {
                font-family: 'Fira Code', 'Courier New', Courier, monospace;
                font-size: 14px;
                font-weight: 700;
                fill: url(#asciiGradient);
                opacity: 0;
                animation: fadeIn 0.1s forwards;
            }
            .float-group {
                animation: float 6s ease-in-out infinite;
            }

            /* Typing Animations for Titles */
            @keyframes type1 {
                0%, 5% { width: 0px; }
                30%, 45% { width: 340px; }
                50%, 100% { width: 0px; }
            }
            @keyframes type2 {
                0%, 50% { width: 0px; }
                55%, 80%, 95% { width: 200px; }
                100% { width: 0px; }
            }
            @keyframes cursorMove {
                0%, 5% { transform: translateX(0px); }
                30%, 45% { transform: translateX(335px); }
                50% { transform: translateX(0px); }
                55%, 80%, 95% { transform: translateX(190px); }
                100% { transform: translateX(0px); }
            }
            @keyframes blink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }
            .type-rect-1 { animation: type1 10s steps(25) infinite; }
            .type-rect-2 { animation: type2 10s steps(15) infinite; }
            .cursor { animation: cursorMove 10s steps(25) infinite, blink 0.7s step-end infinite; }

            /* Detailed Info and Skills Reveal */
            .info-text, .pill-content {
                opacity: 0;
                animation: fadeIn 0.6s ease-out forwards;
            }
            
            /* Glowing Pulse for Pills */
            @keyframes pulseGlow {
                0% { stroke: rgba(59, 130, 246, 0.6); filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.4)); }
                100% { stroke: rgba(139, 92, 246, 1); filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.8)); }
            }
            .glow-rect {
                fill: #161b22;
                stroke-width: 1.5;
                animation: pulseGlow 3s infinite alternate;
            }
        </style>

        <!-- Gradients -->
        <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#58a6ff">
                <animate attributeName="stop-color" values="#58a6ff; #bc8cff; #58a6ff" dur="5s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#bc8cff">
                <animate attributeName="stop-color" values="#bc8cff; #58a6ff; #bc8cff" dur="5s" repeatCount="indefinite" />
            </stop>
        </linearGradient>

        <linearGradient id="asciiGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b82f6">
                <animate attributeName="stop-color" values="#3b82f6; #8b5cf6; #3b82f6" dur="8s" repeatCount="indefinite" />
            </stop>
            <stop offset="50%" stop-color="#8b5cf6">
                <animate attributeName="stop-color" values="#8b5cf6; #ec4899; #8b5cf6" dur="8s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#2dd4bf">
                <animate attributeName="stop-color" values="#2dd4bf; #3b82f6; #2dd4bf" dur="8s" repeatCount="indefinite" />
            </stop>
        </linearGradient>

        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Patterns -->
        <pattern id="scanlinePattern" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="2" fill="#000000" opacity="0.4"/>
        </pattern>

        <!-- Clip Paths -->
        <clipPath id="asciiClip">
            <rect class="ascii-mask-rect" x="0" y="0" width="1180" height="0" />
        </clipPath>
        <clipPath id="clip1"><rect class="type-rect-1" x="510" y="210" width="0" height="50" /></clipPath>
        <clipPath id="clip2"><rect class="type-rect-2" x="510" y="210" width="0" height="50" /></clipPath>
        <clipPath id="terminalClip"><rect x="40" y="40" width="410" height="530" rx="12" /></clipPath>
    </defs>

    <!-- MAIN BACKGROUND -->
    <rect width="1180" height="610" fill="#0d1117" rx="16" stroke="#21262d" stroke-width="2"/>

    <!-- ========================================== -->
    <!-- LEFT SIDE: ASCII CYBER TERMINAL (38%)      -->
    <!-- ========================================== -->
    <rect x="40" y="40" width="410" height="530" fill="#010409" rx="12" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="65" cy="65" r="6" fill="#FF5F56" />
    <circle cx="85" cy="65" r="6" fill="#FFBD2E" />
    <circle cx="105" cy="65" r="6" fill="#27C93F" />
    <line x1="40" y1="90" x2="450" y2="90" stroke="#30363d" stroke-width="1.5" />

    <!-- ASCII Art Group (Floating and Clipped) -->
    <g class="float-group" clip-path="url(#asciiClip)">
        <text x="80" y="130" class="ascii-line" style="animation-delay: 0.1s">SYSTEM KERNEL // v9.0.4</text>
        <text x="80" y="150" class="ascii-line" style="animation-delay: 0.2s">INITIATING SECURE CONNECTION...</text>
        <text x="80" y="170" class="ascii-line" style="animation-delay: 0.3s">[==============================] 100%</text>
        <text x="80" y="190" class="ascii-line" style="animation-delay: 0.4s"> </text>
        <text x="80" y="210" class="ascii-line" style="animation-delay: 0.5s">     /\/\/\/\/\/\/\/\/\/\/\</text>
        <text x="80" y="230" class="ascii-line" style="animation-delay: 0.6s">    &lt;                      &gt;</text>
        <text x="80" y="250" class="ascii-line" style="animation-delay: 0.7s">    &lt;   // DATA_STREAM: OK &gt;</text>
        <text x="80" y="270" class="ascii-line" style="animation-delay: 0.8s">    &lt;   // SYS.INITIALIZED &gt;</text>
        <text x="80" y="290" class="ascii-line" style="animation-delay: 0.9s">    &lt;                      &gt;</text>
        <text x="80" y="310" class="ascii-line" style="animation-delay: 1.0s">    &lt;    _____ __  __      &gt;</text>
        <text x="80" y="330" class="ascii-line" style="animation-delay: 1.1s">    &lt;   / ___/|  \/  |     &gt;</text>
        <text x="80" y="350" class="ascii-line" style="animation-delay: 1.2s">    &lt;   \___ \| |\/| |     &gt;</text>
        <text x="80" y="370" class="ascii-line" style="animation-delay: 1.3s">    &lt;    ___) | |  | |     &gt;</text>
        <text x="80" y="390" class="ascii-line" style="animation-delay: 1.4s">    &lt;   |____/|_|  |_|     &gt;</text>
        <text x="80" y="410" class="ascii-line" style="animation-delay: 1.5s">    &lt;                      &gt;</text>
        <text x="80" y="430" class="ascii-line" style="animation-delay: 1.6s">    &lt;   // USER: S_MAHARJAN&gt;</text>
        <text x="80" y="450" class="ascii-line" style="animation-delay: 1.7s">    &lt;   // ROLE: DEVELOPER &gt;</text>
        <text x="80" y="470" class="ascii-line" style="animation-delay: 1.8s">    &lt;                      &gt;</text>
        <text x="80" y="490" class="ascii-line" style="animation-delay: 1.9s">     \/\/\/\/\/\/\/\/\/\/\/</text>
        <text x="80" y="520" class="ascii-line" style="animation-delay: 2.0s">ACCESS GRANTED.</text>
        <text x="80" y="540" class="ascii-line" style="animation-delay: 2.1s">WELCOME, ADMIN. <tspan fill="#e6edf3" opacity="0.8">_</tspan></text>
    </g>

    <!-- Scanline Effect Overlay (Left Only) -->
    <rect x="40" y="90" width="410" height="480" fill="url(#scanlinePattern)" pointer-events="none" clip-path="url(#terminalClip)"/>
    
    <!-- Moving Scanline Beam -->
    <rect x="40" y="90" width="410" height="3" fill="#3b82f6" opacity="0.5" filter="url(#glow)" clip-path="url(#terminalClip)">
        <animate attributeName="y" values="90; 570; 90" dur="6s" repeatCount="indefinite" />
    </rect>


    <!-- ========================================== -->
    <!-- RIGHT SIDE: PROFESSIONAL WINDOW            -->
    <!-- ========================================== -->
    <rect x="480" y="40" width="660" height="530" fill="#010409" rx="12" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="505" cy="65" r="6" fill="#FF5F56" />
    <circle cx="525" cy="65" r="6" fill="#FFBD2E" />
    <circle cx="545" cy="65" r="6" fill="#27C93F" />
    <line x1="480" y1="90" x2="1140" y2="90" stroke="#30363d" stroke-width="1.5" />

    <!-- GREETING AND HEADER -->
    <text x="510" y="145" font-family="'Inter', sans-serif" font-size="24" fill="#8b949e">Nameste!</text>
    <text x="510" y="195" font-family="'Inter', sans-serif" font-weight="700" font-size="52" fill="url(#nameGradient)">I'm Sujal Maharjan</text>

    <!-- Animated Typing Titles -->
    <text x="510" y="245" font-family="'Fira Code', Consolas, monospace" font-weight="700" font-size="24" fill="#58a6ff" clip-path="url(#clip1)">Python Django Developer</text>
    
    <text x="510" y="245" font-family="'Fira Code', Consolas, monospace" font-weight="700" font-size="24" fill="#58a6ff" clip-path="url(#clip2)">Student</text>

    <rect x="510" y="222" width="12" height="28" fill="#58a6ff" class="cursor" />

    <!-- Personal Details (Sequential Reveal) -->
    <g font-family="'Inter', sans-serif" font-size="16">
        <text x="510" y="305" class="info-text" style="animation-delay: 0.8s">
            <tspan font-weight="700" fill="#8b949e">Location:</tspan> 
            <tspan fill="#e6edf3"> Lalitpur</tspan>
        </text>
        <text x="510" y="340" class="info-text" style="animation-delay: 1.1s">
            <tspan font-weight="700" fill="#8b949e">Education:</tspan> 
            <tspan fill="#e6edf3"> Bachelors</tspan>
        </text>
        <text x="510" y="375" class="info-text" style="animation-delay: 1.4s">
            <tspan font-weight="700" fill="#8b949e">Current Focus:</tspan> 
            <tspan fill="#e6edf3"> Growth and development in tech stack</tspan>
        </text>
        <text x="510" y="410" class="info-text" style="animation-delay: 1.7s">
            <tspan font-weight="700" fill="#8b949e">Email:</tspan> 
            <tspan fill="#58a6ff"> sujalmarjan@gmail.com</tspan>
        </text>
    </g>

    <!-- Skills Section: Glowing Pills -->
    <!-- ROW 1 -->
    <g transform="translate(510, 445)">
        <g class="pill-content" style="animation-delay: 2.0s">
            <rect class="glow-rect" width="60" height="30" rx="15"/><text x="30" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">HTML</text>
        </g>
    </g>
    <g transform="translate(580, 445)">
        <g class="pill-content" style="animation-delay: 2.1s">
            <rect class="glow-rect" width="50" height="30" rx="15"/><text x="25" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">CSS</text>
        </g>
    </g>
    <g transform="translate(640, 445)">
        <g class="pill-content" style="animation-delay: 2.2s">
            <rect class="glow-rect" width="95" height="30" rx="15"/><text x="47.5" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">JavaScript</text>
        </g>
    </g>
    <g transform="translate(745, 445)">
        <g class="pill-content" style="animation-delay: 2.3s">
            <rect class="glow-rect" width="70" height="30" rx="15"/><text x="35" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Python</text>
        </g>
    </g>
    <g transform="translate(825, 445)">
        <g class="pill-content" style="animation-delay: 2.4s">
            <rect class="glow-rect" width="45" height="30" rx="15"/><text x="22.5" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">PHP</text>
        </g>
    </g>
    <g transform="translate(880, 445)">
        <g class="pill-content" style="animation-delay: 2.5s">
            <rect class="glow-rect" width="70" height="30" rx="15"/><text x="35" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Django</text>
        </g>
    </g>
    <g transform="translate(960, 445)">
        <g class="pill-content" style="animation-delay: 2.6s">
            <rect class="glow-rect" width="50" height="30" rx="15"/><text x="25" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">DRF</text>
        </g>
    </g>

    <!-- ROW 2 -->
    <g transform="translate(510, 485)">
        <g class="pill-content" style="animation-delay: 2.7s">
            <rect class="glow-rect" width="90" height="30" rx="15"/><text x="45" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Bootstrap</text>
        </g>
    </g>
    <g transform="translate(610, 485)">
        <g class="pill-content" style="animation-delay: 2.8s">
            <rect class="glow-rect" width="100" height="30" rx="15"/><text x="50" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">PostgreSQL</text>
        </g>
    </g>
    <g transform="translate(720, 485)">
        <g class="pill-content" style="animation-delay: 2.9s">
            <rect class="glow-rect" width="65" height="30" rx="15"/><text x="32.5" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">MySQL</text>
        </g>
    </g>
    <g transform="translate(795, 485)">
        <g class="pill-content" style="animation-delay: 3.0s">
            <rect class="glow-rect" width="65" height="30" rx="15"/><text x="32.5" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">SQLite</text>
        </g>
    </g>
    <g transform="translate(870, 485)">
        <g class="pill-content" style="animation-delay: 3.1s">
            <rect class="glow-rect" width="45" height="30" rx="15"/><text x="22.5" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Git</text>
        </g>
    </g>
    <g transform="translate(925, 485)">
        <g class="pill-content" style="animation-delay: 3.2s">
            <rect class="glow-rect" width="70" height="30" rx="15"/><text x="35" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">GitHub</text>
        </g>
    </g>

    <!-- ROW 3 -->
    <g transform="translate(510, 525)">
        <g class="pill-content" style="animation-delay: 3.3s">
            <rect class="glow-rect" width="80" height="30" rx="15"/><text x="40" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">VS Code</text>
        </g>
    </g>
    <g transform="translate(600, 525)">
        <g class="pill-content" style="animation-delay: 3.4s">
            <rect class="glow-rect" width="60" height="30" rx="15"/><text x="30" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Figma</text>
        </g>
    </g>
    <g transform="translate(670, 525)">
        <g class="pill-content" style="animation-delay: 3.5s">
            <rect class="glow-rect" width="80" height="30" rx="15"/><text x="40" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Postman</text>
        </g>
    </g>
    <g transform="translate(760, 525)">
        <g class="pill-content" style="animation-delay: 3.6s">
            <rect class="glow-rect" width="80" height="30" rx="15"/><text x="40" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#c9d1d9" text-anchor="middle">Swagger</text>
        </g>
    </g>
</svg>
